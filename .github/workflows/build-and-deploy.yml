name: Build CSS and Deploy

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'tailwind.css'
      - 'docs/**/*.html'
      - 'docs/**/*.js'
      - 'docs/**/*.json'
      - 'docs/sitemap.xml'
      - 'docs/robots.txt'
      - 'postcss.config.js'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build CSS
        run: npm run build

      - name: Update sitemap lastmod
        run: |
          node -e "const fs=require('fs');const f='docs/sitemap.xml';const d=new Date().toISOString().slice(0,10);const s=fs.readFileSync(f,'utf8').replace(/<lastmod>[^<]*<\/lastmod>/g,'<lastmod>'+d+'</lastmod>');fs.writeFileSync(f,s);"
          echo "sitemap lastmod set to $(date +%F)"

      - name: Commit and push build artifacts
        id: commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f docs/build.css docs/sitemap.xml
          if git diff --cached --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No artifact changes to commit"
          else
            git commit -m "chore: update build artifacts [skip ci]"
            git push
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Coolify Deployment (Optional)
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.COOLIFY_WEBHOOK_URL }}" ]; then
            echo "Triggering Coolify webhook..."
            curl -X POST "${{ secrets.COOLIFY_WEBHOOK_URL }}"
          else
            echo "No Coolify webhook configured (COOLIFY_WEBHOOK_URL secret not set)"
          fi
